name: Bug report
description: Report a reproducible problem with the skill, scripts, packaging, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please avoid including private, confidential, or personal text. Use a short redacted example instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the shortest command or prompt that demonstrates the issue.
      placeholder: |
        1. Install...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Redacted example
      description: Include before/after text only if it is safe to share publicly.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.0.0
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Polish
        - English
        - Polish and English
        - Not language-specific
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed private or sensitive text from this report.
          required: true
